name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://app:password@localhost:15432/app
    steps:
      - uses: actions/checkout@v7

      - name: Start Postgres
        run: docker compose -f compose.dev.yml up -d --wait

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint:ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Postgres logs on failure
        if: failure()
        run: docker compose -f compose.dev.yml logs --tail 100
