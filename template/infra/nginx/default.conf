server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 10m;

    # Docker's embedded DNS. Resolving per request (via the variables below)
    # lets nginx start before the upstreams and survive their restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $api_upstream http://api:3002;
    set $web_upstream http://web:3000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
